<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Robot Blackjack Attack</title>
    <!-- CrazyGames SDK v3 (ads, gameplay events, leaderboard submit, iframe-safe storage). Loaded
         from their CDN — not npm — and exposed as window.CrazyGames.SDK. It is absent off-platform
         (and may fail to load if blocked); the game degrades gracefully, see
         src/platform/crazygames.ts. Classic script in <head> so it runs before the deferred module. -->
    <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b0b12;
        /* CrazyGames-recommended: block accidental selection of game elements.
           On mobile/tablets a double-tap or press-and-hold would otherwise raise
           the magnifier or select the whole game and pop a contextual menu. */
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
        /* Suppress the tap-highlight flash on touch interactions. */
        -webkit-tap-highlight-color: transparent;
      }
      #app {
        position: fixed;
        inset: 0;
        /* Kill the mobile double-tap-to-zoom gesture across the whole game. iOS
           Safari ignores viewport `user-scalable=no`, so this is what actually
           stops a double-tap on a button/HUD element from zooming the page.
           `manipulation` still allows normal taps/scroll; touch-action resolves up
           the DOM ancestor chain, so this one rule covers every overlay control.
           The canvas narrows it further to `none` in its own rule below. */
        touch-action: manipulation;
      }
      canvas {
        display: block;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
